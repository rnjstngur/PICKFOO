<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>로그인 | PICKFOO</title><link rel="stylesheet" href="style.css"><script src="login-db.js" defer></script><script src="pickfoo-api-config.js"></script></head>
<body class="auth-page"><a class="logo auth-logo" href="index.html">PICK<span>FOO</span></a>
<main class="auth-card"><a class="back-link" href="index.html">← 메인으로</a><p class="eyebrow">WELCOME BACK</p><h1>로그인</h1><p class="muted">다시 만나서 반가워요.</p>
<form id="loginForm" class="form-stack"><label>이메일<input id="email" type="email" placeholder="name@example.com" required autocomplete="email"></label><label>비밀번호<input id="password" type="password" placeholder="비밀번호 입력" required autocomplete="current-password" minlength="6"></label><button class="button button-primary button-full" type="submit">로그인</button><p class="form-message" id="formMessage" role="status"></p></form>
<p class="auth-switch">아직 회원이 아니신가요? <a href="signup.html">회원가입</a></p></main></body></html>
