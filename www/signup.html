<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>회원가입 | PICKFOO</title><link rel="stylesheet" href="style.css"><script src="signup-db.js" defer></script><script src="pickfoo-api-config.js"></script></head>
<body class="auth-page"><a class="logo auth-logo" href="index.html">PICK<span>FOO</span></a>
<main class="auth-card auth-card-wide"><a class="back-link" href="index.html">← 메인으로</a><p class="eyebrow">JOIN PICKFOO</p><h1>회원가입</h1><p class="muted">가입하고 나에게 맞는 음식 조합을 찾아보세요.</p>
<form id="signupForm" class="form-stack"><label>닉네임<input id="nickname" type="text" placeholder="화면에 표시할 이름" required maxlength="24" autocomplete="nickname"></label><label>이메일<input id="email" type="email" placeholder="name@example.com" required autocomplete="email"></label><label>비밀번호<input id="password" type="password" placeholder="6자 이상" required minlength="8" autocomplete="new-password"></label><label>비밀번호 확인<input id="passwordConfirm" type="password" placeholder="비밀번호 다시 입력" required minlength="8" autocomplete="new-password"></label><button class="button button-primary button-full" type="submit">가입하고 음식 취향 설정하기</button><p class="form-message" id="formMessage" role="status"></p></form>
<p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></p><p class="demo-note">시연용 계정 정보는 이 기기에서만 관리됩니다. 평소 사용하는 이메일/비밀번호를 입력하지 마세요. 실제 서비스에는 서버 인증이 필요합니다.</p></main></body></html>
